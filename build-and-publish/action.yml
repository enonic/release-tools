name: build-and-push
description: This is an action to automate Gradle build and push tasks

inputs:
  repoUser:
    description: 'When publishing which user to use.'
    required: true
  repoPassword:
    description: 'When publishing which password to use.'
    required: true
  publishTask:
    description: 'Gradle task when publishing is needed'
    default: 'build publish'
    required: false
  buildTask:
    description: 'Gradle task when only build is needed'
    default: 'build'
    required: false
  skipPublishing:
    description: 'Should publishing be fully skipped regardless of any other conditions'
    default: ''
    required: false
  dockerhubUsername:
    description: 'Dockerhub username'
    required: false
  dockerhubToken:
    description: 'Dockerhub token'
    required: false
  codecovToken:
    description: 'Codecov token'
    required: false
  npmPublish:
    description: 'Publish the npm package on release. Requires id-token:write in the caller for npm OIDC trusted publishing.'
    default: ''
    required: false
  npmDir:
    description: 'Directory containing the pre-built npm package to publish.'
    default: 'build/types'
    required: false
  nodeVersion:
    description: 'Node.js version used for npm publish.'
    default: '24.x'
    required: false
  releaseBranch:
    description: >-
      Newline-separated list of branches allowed to publish release (non-SNAPSHOT) versions.
      SNAPSHOT versions are also published from the repository default branch.
      Empty disables release publishing.
    default: |
      master
      main
    required: false
outputs:
  release:
    description: "If this build should be released"
    value: ${{ steps.publish_vars.outputs.release == 'true' && steps.check_branch.outputs.is_release_branch == 'true' }}

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - id: check_branch
      run: |
        CURRENT="${GITHUB_REF#refs/heads/}"
        IS_RELEASE=false
        while IFS= read -r branch; do
          branch="$(echo "$branch" | xargs)"
          [ -z "$branch" ] && continue
          if [ "$branch" = "$CURRENT" ]; then
            IS_RELEASE=true
            break
          fi
        done <<< "${{ inputs.releaseBranch }}"
        IS_DEFAULT=false
        if [ -n "$DEFAULT_BRANCH" ] && [ "$CURRENT" = "$DEFAULT_BRANCH" ]; then
          IS_DEFAULT=true
        fi
        echo "is_release_branch=$IS_RELEASE" >> $GITHUB_OUTPUT
        echo "is_default_branch=$IS_DEFAULT" >> $GITHUB_OUTPUT
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      shell: bash

    - name: Get publishing variables
      id: publish_vars
      uses: enonic/release-tools/publish-vars@master
      env:
        PROPERTIES_PATH: './gradle.properties'
        GITHUB_REPO_PRIVATE: ${{ github.event.repository.private }}


    # Release (non-SNAPSHOT) versions publish only from releaseBranch branches.
    # SNAPSHOT versions publish from those branches and from the default branch.
    # skipPublishing: '' = the branch rules above, 'true' = never, any other value = always.
    - id: task_generator
      run: |
        if [ "$SKIP_PUBLISHING" = "true" ] || [ -z "$REPO" ]; then
          TASK="$BUILD_TASK"
        elif [ -n "$SKIP_PUBLISHING" ]; then
          TASK="$PUBLISH_TASK"
        elif [ "$IS_RELEASE_BRANCH" = "true" ]; then
          TASK="$PUBLISH_TASK"
        elif [ "$IS_DEFAULT_BRANCH" = "true" ] && [ "$IS_RELEASE_VERSION" != "true" ]; then
          TASK="$PUBLISH_TASK"
        else
          TASK="$BUILD_TASK"
        fi
        echo "task=$TASK" >> $GITHUB_OUTPUT
      env:
        SKIP_PUBLISHING: ${{ inputs.skipPublishing }}
        REPO: ${{ steps.publish_vars.outputs.repo }}
        IS_RELEASE_BRANCH: ${{ steps.check_branch.outputs.is_release_branch }}
        IS_DEFAULT_BRANCH: ${{ steps.check_branch.outputs.is_default_branch }}
        IS_RELEASE_VERSION: ${{ steps.publish_vars.outputs.release }}
        BUILD_TASK: ${{ inputs.buildTask }}
        PUBLISH_TASK: ${{ inputs.publishTask }}
      shell: bash

    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ steps.publish_vars.outputs.javaVersion }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - run: ./gradlew ${{ steps.task_generator.outputs.task }} ${{ steps.publish_vars.outputs.xpSnapshot == 'true' && '--refresh-dependencies' || '' }} -Pcom.enonic.xp.app.production=true -PrepoKey=${{ steps.publish_vars.outputs.repo }} -PrepoUser=${{ inputs.repoUser }} -PrepoPassword=${{ inputs.repoPassword }} -PenonicRepoUsername=${{ inputs.repoUser }} -PenonicRepoPassword=${{ inputs.repoPassword }}
      shell: bash

    - name: Set up Node (npm publish)
      if: ${{ inputs.npmPublish == 'true' && inputs.skipPublishing != 'true' && steps.publish_vars.outputs.release == 'true' && steps.check_branch.outputs.is_release_branch == 'true' }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.nodeVersion }}

    - name: NPM publish
      if: ${{ inputs.npmPublish == 'true' && inputs.skipPublishing != 'true' && steps.publish_vars.outputs.release == 'true' && steps.check_branch.outputs.is_release_branch == 'true' }}
      run: |
        VERSION="${{ steps.publish_vars.outputs.version }}"
        if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          NPM_TAG=latest
        else
          NPM_TAG=beta
        fi
        echo "Publishing npm package '$VERSION' with tag '$NPM_TAG' from '${{ inputs.npmDir }}'"
        ( cd "${{ inputs.npmDir }}" && npx -y npm@latest publish --tag "$NPM_TAG" --ignore-scripts )
      shell: bash

    - uses: docker/setup-qemu-action@v4
      if: inputs.dockerhubUsername != '' && inputs.skipPublishing != 'true' && steps.publish_vars.outputs.release == 'true' && steps.check_branch.outputs.is_release_branch == 'true'
      with:
        image: tonistiigi/binfmt:qemu-v6.2.0
        platforms: arm64,amd64

    - uses: docker/setup-buildx-action@v4
      if: inputs.dockerhubUsername != '' && inputs.skipPublishing != 'true' && steps.publish_vars.outputs.release == 'true' && steps.check_branch.outputs.is_release_branch == 'true'

    - uses: docker/login-action@v4
      if: inputs.dockerhubUsername != '' && inputs.skipPublishing != 'true' && steps.publish_vars.outputs.release == 'true' && steps.check_branch.outputs.is_release_branch == 'true'
      with:
        username: ${{ inputs.dockerhubUsername }}
        password: ${{ inputs.dockerhubToken }}

    - name: Docker build and push
      uses: docker/build-push-action@v7
      if: inputs.dockerhubUsername != '' && inputs.skipPublishing != 'true' && steps.publish_vars.outputs.release == 'true' && steps.check_branch.outputs.is_release_branch == 'true'
      with:
        context: .
        pull: true
        no-cache: true
        push: true
        tags: enonic/${{ steps.publish_vars.outputs.projectName }}:${{ steps.publish_vars.outputs.version }}
        platforms: linux/amd64,linux/arm64

    - uses: codecov/codecov-action@v6
      with:
        token: ${{ inputs.codecovToken }}
